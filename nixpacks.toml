# ==========================================================================
# OniQuant v6.0 — Railway.app Nixpacks Build Configuration
# ==========================================================================

[phases.setup]
nixPkgs = [
  "gcc",
  "libffi",
  "openssl",
  "postgresql",
  "zlib",
]

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --loop uvloop --http httptools"
